<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Credencial digital</title>


<style>

/* =====================================
   CONFIGURACIÓN GENERAL
===================================== */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}


body {

    min-height: 100vh;

    background:
        linear-gradient(
            145deg,
            #141f45,
            #24387a
        );

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    display: flex;

    justify-content: center;

    align-items: center;

    padding: 20px;

}


/* =====================================
   TARJETA PRINCIPAL
===================================== */

.credencial {

    width: 100%;

    max-width: 430px;

    background: white;

    border-radius: 26px;

    overflow: hidden;

    box-shadow:
        0 18px 45px
        rgba(0,0,0,0.30);

}


/* =====================================
   ENCABEZADO
===================================== */

.encabezado {

    background: #24387a;

    color: white;

    padding:
        25px 20px 75px;

    text-align: center;

    position: relative;

}


.logo {

    height: 50px;

    width: auto;

    max-width: 100%;

    object-fit: contain;

    background: white;

    border-radius: 12px;

    padding: 8px 16px;

    margin-bottom: 14px;

}


.titulo {

    font-size: 12px;

    letter-spacing: 2.5px;

    text-transform: uppercase;

    opacity: 0.85;

}


/* =====================================
   INFORMACIÓN PRINCIPAL
===================================== */

.informacion-principal {

    text-align: center;

    padding:
        30px 25px 25px;

}


.nombre {

    font-size: 27px;

    font-weight: 800;

    color: #24387a;

    line-height: 1.15;

    margin-bottom: 8px;

}



/* =====================================
   ESTADO
===================================== */

.estado {

    text-align: center;

    margin-bottom: 20px;

}


.estado > span {

    display: inline-flex;

    align-items: center;

    gap: 7px;

    padding:
        8px 16px;

    background: #e9f7ef;

    color: #168044;

    border-radius: 20px;

    font-size: 12px;

    font-weight: bold;

}


.punto {

    width: 8px;

    height: 8px;

    background: #168044;

    border-radius: 50%;

}


/* =====================================
   INFORMACIÓN ADMINISTRATIVA
===================================== */

.informacion-admin {

    padding:
        0 20px 25px;

}




.titulo-seccion {

    color: #24387a;

    font-size: 15px;

    font-weight: bold;

    margin:
        15px 0 12px;

    padding-bottom: 8px;

    border-bottom:
        2px solid #24387a;

}


.dato {

    padding:
        11px 0;

    border-bottom:
        1px solid #e8ebef;

}


.etiqueta {

    display: block;

    color: #8a8a8a;

    font-size: 11px;

    margin-bottom: 4px;

}


.valor {

    display: block;

    color: #222b36;

    font-size: 14px;

    word-break: break-word;

}


/* =====================================
   EMERGENCIAS
===================================== */

.emergencia {

    background: #f5f7fa;

    border-radius: 14px;

    padding: 15px;

    margin-top: 10px;

}


.emergencia-titulo {

    color: #24387a;

    font-size: 13px;

    font-weight: bold;

    margin-bottom: 10px;

}


/* =====================================
   PIE
===================================== */

.pie {

    text-align: center;

    padding: 15px;

    background: #1a2a5e;

    color: white;

    font-size: 10px;

}


/* =====================================
   ERROR
===================================== */

.error {

    padding: 50px 25px;

    text-align: center;

    color: #24387a;

}

</style>

</head>


<body>


<!-- ===================================
     CREDENCIAL
=================================== -->

<div
    class="credencial"
    id="credencial"
>


    <!-- ENCABEZADO -->

    <div class="encabezado">


        <img
            src="fotos/logo.png"
            class="logo"
            alt="Logo de la empresa"
        >


        <div class="titulo">

            Credencial digital

        </div>


    </div>



    <!-- INFORMACIÓN PRINCIPAL -->

    <div
        class="informacion-principal"
    >


        <div
            id="nombre"
            class="nombre"
        >

            Cargando...

        </div>


    </div>



    <!-- ESTADO -->

    <div class="estado">


        <span>

            <span class="punto"></span>

            EMPLEADO ACTIVO

        </span>


    </div>



    <!-- INFORMACIÓN ADMINISTRATIVA -->

    <div
        class="informacion-admin"
        id="informacionAdmin"
    >



        <div class="titulo-seccion">

            Seguridad social

        </div>


        <div class="dato">

            <span class="etiqueta">

                NSS (Número de Seguridad Social)

            </span>

            <span
                id="imss"
                class="valor"
            >

            </span>

        </div>



        <div class="titulo-seccion">

            Contactos de emergencia

        </div>


        <div class="emergencia">


            <div class="emergencia-titulo">

                🚨 Contacto 1

            </div>


            <div class="dato">

                <span class="etiqueta">

                    Nombre

                </span>

                <span
                    id="emergenciaNombre1"
                    class="valor"
                >

                </span>

            </div>


            <div class="dato">

                <span class="etiqueta">

                    Teléfono

                </span>

                <span
                    id="emergenciaTelefono1"
                    class="valor"
                >

                </span>

            </div>


        </div>



        <div class="emergencia">


            <div class="emergencia-titulo">

                🚨 Contacto 2

            </div>


            <div class="dato">

                <span class="etiqueta">

                    Nombre

                </span>

                <span
                    id="emergenciaNombre2"
                    class="valor"
                >

                </span>

            </div>


            <div class="dato">

                <span class="etiqueta">

                    Teléfono

                </span>

                <span
                    id="emergenciaTelefono2"
                    class="valor"
                >

                </span>

            </div>


        </div>


    </div>



    <!-- PIE -->

    <div class="pie">

        Documento de identificación laboral

    </div>


</div>



<script>


/* =====================================
   DATOS DE LOS EMPLEADOS
===================================== */


const empleados = {


    "EMP001": {


        nombre:
            "Jonathan Barrera Ricardo",


        puesto:
            "Ejecutivo de ventas",


        imss:
            "66170233952",


        emergenciaNombre1:
            "Izet yaneli Barrera Ricardo",


        emergenciaTelefono1:
            "7226200542",


        emergenciaNombre2:
            "Imelda Ricardo Gómez",


        emergenciaTelefono2:
            "7204709272"

    },


    "EMP002": {


        nombre:
            "María López García",


        puesto:
            "Recepcionista",


        imss:
            "00000000000",


        emergenciaNombre1:
            "Ana García",


        emergenciaTelefono1:
            "555 333 3333",


        emergenciaNombre2:
            "Pedro López",


        emergenciaTelefono2:
            "555 444 4444"

    },


    "EMP003": {

        nombre:
            "",

        puesto:
            "",

        imss:
            "",

        emergenciaNombre1:
            "",

        emergenciaTelefono1:
            "",

        emergenciaNombre2:
            "",

        emergenciaTelefono2:
            ""

    },


    "EMP004": {

        nombre:
            "",

        puesto:
            "",

        imss:
            "",

        emergenciaNombre1:
            "",

        emergenciaTelefono1:
            "",

        emergenciaNombre2:
            "",

        emergenciaTelefono2:
            ""

    },


    "EMP005": {

        nombre:
            "",

        puesto:
            "",

        imss:
            "",

        emergenciaNombre1:
            "",

        emergenciaTelefono1:
            "",

        emergenciaNombre2:
            "",

        emergenciaTelefono2:
            ""

    }

};



/* =====================================
   TOKENS DE URL (NO SECUENCIALES)
===================================== */

/*
    Cada empleado tiene un token aleatorio
    para la URL, sin relación con el
    anterior o el siguiente (a diferencia
    de EMP001, EMP002...), para que no se
    pueda "adivinar" cambiando el número.

    Ya están listos EMP001 a EMP005 (edita
    sus datos directamente en "empleados",
    ahí arriba, en las comillas vacías).

    Si más adelante das de alta un EMP006
    en adelante:
    1. Agrega su registro en "empleados"
       con su propio EMPxxx.
    2. Genera un token nuevo, por ejemplo
       con este comando en terminal:
           openssl rand -hex 5
    3. Agrega la línea "token": "EMPxxx"
       aquí abajo.
*/

const mapaTokens = {

    "aaa6334cc8": "EMP001",

    "35bc496174": "EMP002",

    "86e4510555": "EMP003",

    "2a67ed1f9d": "EMP004",

    "6abe3a2fa4": "EMP005"

};



/* =====================================
   OBTENER ID DEL EMPLEADO
===================================== */


const parametros =
    new URLSearchParams(
        window.location.search
    );


const tokenURL =
    parametros.get("id");


const empleadoID =
    mapaTokens[tokenURL];


const empleado =
    empleados[empleadoID];



/* =====================================
   MOSTRAR INFORMACIÓN
===================================== */


if (empleado) {


    document.getElementById("nombre")
        .textContent =
        empleado.nombre;


    document.getElementById("imss")
        .textContent =
        empleado.imss;


    document.getElementById("emergenciaNombre1")
        .textContent =
        empleado.emergenciaNombre1;


    document.getElementById("emergenciaTelefono1")
        .textContent =
        empleado.emergenciaTelefono1;


    document.getElementById("emergenciaNombre2")
        .textContent =
        empleado.emergenciaNombre2;


    document.getElementById("emergenciaTelefono2")
        .textContent =
        empleado.emergenciaTelefono2;


}


/* =====================================
   EMPLEADO NO ENCONTRADO
===================================== */


else {


    document.getElementById("credencial")
        .innerHTML = `

            <div class="error">

                <h2>
                    Empleado no encontrado
                </h2>

                <br>

                <p>
                    Verifica el código
                    del empleado.
                </p>

            </div>

        `;

}



</script>


</body>

</html>
